<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreditFlow AI</title>
<style>
:root{
  --bg:#f7f7f6;--surface:#fff;--border:rgba(0,0,0,.08);--border-med:rgba(0,0,0,.13);
  --text:#111;--muted:#888;--faint:#ccc;
  --green:#1a9e6e;--green-bg:#edf7f2;--green-b:#a3dfc3;
  --amber:#a07010;--amber-bg:#fdf4e3;--amber-b:#f0c96a;
  --red:#c0392b;--red-bg:#fdf0ef;--red-b:#f5b4ae;
  --blue:#1a6bc0;--blue-bg:#eef4fd;
  --r:10px;--rs:6px;--font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:50px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pu 2s infinite;flex-shrink:0}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
.brand{font-size:14px;font-weight:700;letter-spacing:-.4px}
.brand-tag{font-size:11px;color:var(--muted)}
.tbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.agent-pill{font-size:11px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-b);border-radius:999px;padding:3px 10px;display:flex;align-items:center;gap:5px}
.feed-wrap{padding:6px 18px;border-bottom:1px solid var(--border);background:var(--surface);overflow:hidden;flex-shrink:0}
.feed-track{display:flex;gap:10px;white-space:nowrap}
.fi{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);flex-shrink:0}
.fd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fg{background:var(--green)}.fa{background:var(--amber)}.fr{background:var(--red)}.fb{background:var(--blue)}

.body{display:grid;grid-template-columns:220px 1fr 300px;flex:1;overflow:hidden}

/* LEFT */
.lp{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.ph{padding:10px 12px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cpill{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 7px;font-size:10px}
.queue{overflow-y:auto;flex:1}
.qi{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.qi:hover{background:var(--bg)}
.qi.on{background:var(--green-bg);border-left:2px solid var(--green)}
.qi-name{font-size:12px;font-weight:600}
.qi-r{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.qi-amt{font-size:11px;color:var(--muted)}
.qidot{width:7px;height:7px;border-radius:50%}
.qi-s{font-size:10px;margin-top:2px}

/* CENTER */
.cp{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}

.v-eye{font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;font-weight:700}
.v-word{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1}
.v-pct{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:4px 0 2px}
.v-sub{font-size:11px;color:var(--muted)}
.vg{color:var(--green)}.va{color:var(--amber)}.vr{color:var(--red)}
.src-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.src{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid}
.sok{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.sno{background:var(--red-bg);color:var(--red);border-color:var(--red-b)}
.saving{margin-top:8px;padding:7px 10px;background:var(--blue-bg);border-radius:var(--rs);font-size:11px;color:var(--blue)}

.steps-row{display:flex;align-items:center}
.step{display:flex;flex-direction:column;align-items:center;flex:1}
.sc{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--faint);background:var(--bg)}
.sc.done{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.sc.cur{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.sc.cwarn{background:var(--amber);color:#fff;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.sc.cdanger{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.sl{font-size:9px;color:var(--muted);margin-top:4px;text-align:center}
.sline{flex:1;height:1px;background:var(--border);margin-bottom:18px}
.sline.done{background:var(--green-b)}

.ct{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.ck-row{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)}
.ck-row:last-child{border-bottom:none}
.ck{font-size:13px;font-weight:700}
.cok{color:var(--green)}.cwn{color:var(--amber)}.cfail{color:var(--red)}

.act-row{display:flex;gap:7px}
.btn-m{flex:1;background:#111;color:#fff;border:none;border-radius:var(--rs);padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-m:hover{background:#333}
.btn-s{background:transparent;color:var(--text);border:1px solid var(--border-med);border-radius:var(--rs);padding:10px 12px;font-size:12px;cursor:pointer;font-family:var(--font)}
.btn-s:hover{background:var(--bg)}

/* RIGHT */
.rp{border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.chat-head{padding:11px 13px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:90%;padding:8px 11px;font-size:12px;line-height:1.5;border-radius:var(--r)}
.msg-ai{background:var(--bg);color:var(--text);border:1px solid var(--border);align-self:flex-start}
.msg-user{background:#111;color:#fff;align-self:flex-end}
.typing-wrap{background:var(--bg);border:1px solid var(--border);align-self:flex-start;padding:9px 14px;border-radius:var(--r)}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 1px;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
.chat-inp-wrap{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
.cinp{flex:1;padding:8px 10px;border:1px solid var(--border-med);border-radius:var(--rs);font-size:12px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;resize:none}
.cinp:focus{border-color:var(--green);background:#fff}
.sbtn{background:#111;color:#fff;border:none;border-radius:var(--rs);padding:8px 12px;cursor:pointer;font-size:14px}
.sbtn:hover{background:#333}
</style>
</head>
<body>

<div class="topbar">
  <div class="pulse"></div>
  <div class="brand">CreditFlow AI</div>
  <div class="brand-tag">Автоматическая обработка кредитных заявок</div>
  <div class="tbar-r">
    <div class="agent-pill"><div class="pulse"></div>Агент активен</div>
    <div style="font-size:11px;color:var(--muted)" id="qcnt">24 заявки в очереди</div>
  </div>
</div>

<div class="feed-wrap">
  <div class="feed-track" id="feed"></div>
</div>

<div class="body">
  <div class="lp">
    <div class="ph">Очередь <span class="cpill">5</span></div>
    <div class="queue" id="queue"></div>
  </div>
  <div class="cp">
    <div class="card" id="vc" style="text-align:center"></div>
    <div class="card" id="stc"></div>
    <div class="card" id="chc"></div>
    <div class="card" id="ac" style="padding:12px 16px"></div>
  </div>
  <div class="rp">
    <div class="chat-head"><div class="pulse"></div>AI Агент — чат</div>
    <div class="chat-msgs" id="msgs"></div>
    <div class="chat-inp-wrap">
      <textarea class="cinp" id="cinp" rows="2" placeholder="Спросите агента о заявке…"></textarea>
      <button class="sbtn" onclick="sendChat()">↑</button>
    </div>
  </div>
</div>

<script>
const C=[
  {name:'Иван Петров',id:'8451',amt:'450 000 ₽',term:'36 мес.',word:'APPROVE',wc:'vg',pct:87,stage:3,st:'cur',
   checks:[['cok','✓','Паспорт распознан — данные совпадают'],['cok','✓','Справка о доходах верифицирована (ФНС)'],['cok','✓','Телефон подтверждён'],['cok','✓','БКИ: кредитная история чистая'],['cok','✓','Долговая нагрузка: 28% — норма']],
   sources:[['ok','БКИ'],['ok','ФНС'],['ok','Документы'],['ok','CRM'],['ok','Email']],saving:'~12 минут сэкономлено',
   replies:['Заявка #8451 — отличный профиль. Все проверки пройдены, нагрузка 28%, история чистая. Рекомендую одобрить.','Документы полные, расхождений нет. Доход подтверждён по ФНС — 87 000 ₽/мес.','Следующий шаг: передать на согласование менеджеру. Уведомление в CRM и Telegram отправлено.','Риск минимальный. Вероятность дефолта по модели — 4%.']},
  {name:'Анна Сидорова',id:'8452',amt:'180 000 ₽',term:'24 мес.',word:'REVIEW',wc:'va',pct:54,stage:1,st:'cwarn',
   checks:[['cok','✓','Паспорт распознан'],['cfail','✗','Справка о доходах отсутствует'],['cok','✓','Телефон подтверждён'],['cwn','!','Неполный пакет: 3 из 5 документов']],
   sources:[['ok','БКИ'],['no','ФНС'],['no','Документы'],['ok','CRM'],['ok','Email']],saving:'~8 минут сэкономлено',
   replies:['Заявка #8452 приостановлена — не хватает справки о доходах и выписки по счёту.','Запрос клиенту отправлен через Telegram. Ожидаем ответ в течение 48 часов.','ФНС ещё не подтверждена. Остальные данные в норме — можно одобрить после загрузки документов.','Рекомендую не затягивать: клиент активный, отвечает быстро.']},
  {name:'Сергей Иванов',id:'8453',amt:'700 000 ₽',term:'60 мес.',word:'DECLINE',wc:'vr',pct:22,stage:2,st:'cdanger',
   checks:[['cok','✓','Паспорт распознан'],['cfail','✗','Расхождение в справке о доходах'],['cfail','✗','Телефон не подтверждён'],['cfail','✗','Долговая нагрузка: 72% — критично'],['cwn','!','3 активных кредита в БКИ']],
   sources:[['ok','БКИ'],['no','ФНС'],['no','Документы'],['ok','CRM'],['no','Телефон']],saving:'~20 минут сэкономлено',
   replies:['Заявка #8453 — высокий риск. Нагрузка 72%, три активных кредита, расхождение данных.','Рекомендую отклонить. Даже при подтверждении дохода нагрузка превысит норму.','Телефон не подтверждён — возможна верификация через Email, но это удлинит процесс.','Если клиент настаивает — предложить меньшую сумму: до 200 000 ₽ на 24 месяца.']},
  {name:'Мария Козлова',id:'8454',amt:'95 000 ₽',term:'12 мес.',word:'APPROVE',wc:'vg',pct:91,stage:4,st:'done',
   checks:[['cok','✓','Все документы в порядке'],['cok','✓','Доход подтверждён, нагрузка 18%'],['cok','✓','Кредитная история: без замечаний'],['cok','✓','БКИ и ФНС совпадают']],
   sources:[['ok','БКИ'],['ok','ФНС'],['ok','Документы'],['ok','CRM'],['ok','Email']],saving:'~15 минут сэкономлено',
   replies:['Заявка #8454 — идеальный профиль. Нагрузка 18%, история чистая, все источники подтверждены.','Одобрение прошло автоматически. Клиент уведомлён через Telegram.','Рекомендую предложить увеличение лимита — клиент надёжный.','Выдача готова к оформлению.']},
  {name:'Дмитрий Орлов',id:'8455',amt:'320 000 ₽',term:'48 мес.',word:'REVIEW',wc:'va',pct:41,stage:0,st:'cwarn',
   checks:[['cfail','✗','Паспорт не загружен'],['cfail','✗','Справка о доходах отсутствует'],['cok','✓','Телефон подтверждён'],['cwn','!','БКИ: запрос отправлен, ожидание']],
   sources:[['no','БКИ'],['no','ФНС'],['no','Документы'],['ok','CRM'],['ok','Email']],saving:'~6 минут сэкономлено',
   replies:['Заявка #8455 не может быть обработана — паспорт и справка о доходах не загружены.','Отправил клиенту напоминание через Email и Telegram. Повторное уведомление через 24 часа.','Как только документы поступят — агент запустит проверку автоматически.','БКИ запрошен, ждём ответа.']}
];

const stageLabels=['Получение','Документы','Анализ AI','Решение','Выдача'];
const feedPool=[
  {c:'fg',t:'Документы Петрова проверены'},
  {c:'fa',t:'Запрошены документы у Сидоровой'},
  {c:'fr',t:'Расхождение в справке Иванова'},
  {c:'fg',t:'Козлова — одобрено автоматически'},
  {c:'fb',t:'БКИ: получены 3 новых ответа'},
  {c:'fa',t:'Орлов: паспорт не загружен'},
  {c:'fg',t:'Новая заявка: Ковалёва 250 000 ₽'},
  {c:'fb',t:'ФНС подтвердила доход Петрова'},
  {c:'fr',t:'Иванов: нагрузка превышает норму'},
  {c:'fg',t:'Скоринг Козловой: 91%'},
];
let feedIdx=4, active=0;

function buildFeed(){
  const t=document.getElementById('feed');
  feedPool.slice(0,7).forEach(f=>{
    const e=document.createElement('div');
    e.className='fi';
    e.innerHTML=`<div class="fd ${f.c}"></div>${f.t}`;
    t.appendChild(e);
  });
}
function addFeed(){
  const t=document.getElementById('feed');
  const f=feedPool[feedIdx%feedPool.length]; feedIdx++;
  const e=document.createElement('div');
  e.className='fi'; e.style.opacity='0';
  e.innerHTML=`<div class="fd ${f.c}"></div>${f.t} <span style="color:var(--faint);margin-left:3px">только что</span>`;
  t.insertBefore(e,t.firstChild);
  setTimeout(()=>{e.style.transition='opacity .5s';e.style.opacity='1';},30);
  if(t.children.length>10)t.removeChild(t.lastChild);
}

function buildQueue(){
  const el=document.getElementById('queue'); el.innerHTML='';
  const cm={vg:'var(--green)',va:'var(--amber)',vr:'var(--red)'};
  const lm={vg:'Одобрить',va:'Проверить',vr:'Отклонить'};
  C.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='qi'+(i===active?' on':'');
    d.onclick=()=>pick(i);
    d.innerHTML=`<div class="qi-name">${c.name}</div>
      <div class="qi-r"><span class="qi-amt">${c.amt}</span><div class="qidot" style="background:${cm[c.wc]}"></div></div>
      <div class="qi-s" style="color:${cm[c.wc]}">${c.pct}% · ${lm[c.wc]}</div>`;
    el.appendChild(d);
  });
}

function renderCenter(){
  const c=C[active];
  // verdict
  document.getElementById('vc').innerHTML=`
    <div class="v-eye">AI RECOMMENDATION · #${c.id}</div>
    <div class="v-word ${c.wc}">${c.word}</div>
    <div class="v-pct ${c.wc}">${c.pct}%</div>
    <div class="v-sub">${c.name} · ${c.amt} · ${c.term}</div>
    <div class="src-row">${c.sources.map(s=>`<div class="src s${s[0]}">${s[1]}</div>`).join('')}</div>
    <div class="saving">⏱ ${c.saving}</div>`;
  // steps
  let h='<div class="steps-row">';
  stageLabels.forEach((l,i)=>{
    let cls=i<c.stage?'done':i===c.stage?c.st:'';
    h+=`<div class="step"><div class="sc ${cls}">${i+1}</div><div class="sl">${l}</div></div>`;
    if(i<4)h+=`<div class="sline${i<c.stage?' done':''}"></div>`;
  });
  document.getElementById('stc').innerHTML=h+'</div>';
  // checks
  document.getElementById('chc').innerHTML=`<div class="ct">ВЫВОД АГЕНТА · ЗАЯВКА #${c.id}</div>`+
    c.checks.map(ch=>`<div class="ck-row"><span class="ck ${ch[0]}">${ch[1]}</span><span>${ch[2]}</span></div>`).join('');
  // actions
  const al={vg:'Одобрить заявку →',va:'Запросить документы →',vr:'Отклонить заявку →'};
  document.getElementById('ac').innerHTML=`<div class="act-row">
    <button class="btn-m" onclick="doAction()">${al[C[active].wc]}</button>
    <button class="btn-s" onclick="fakeChat('Объясни рекомендацию по заявке #${c.id}')">Спросить</button>
    <button class="btn-s" onclick="fakeChat('Что дальше по заявке #${c.id}?')">Что дальше?</button>
  </div>`;
}

function pick(i){
  active=i;
  document.querySelectorAll('.qi').forEach((el,j)=>el.classList.toggle('on',j===i));
  renderCenter();
  fakeChat(`Дай оценку заявки #${C[i].id}`);
}

function doAction(){
  const c=C[active];
  const m={vg:`Подтверждаю одобрение #${c.id}`,va:`Запрашиваю документы у ${c.name}`,vr:`Отклоняю заявку #${c.id}`};
  fakeChat(m[c.wc]);
}

// ── МУЛяЖ ЧАТА ──
let replyIdx=0;
function addMsg(role,text){
  const el=document.createElement('div');
  el.className=role==='user'?'msg msg-user':'msg msg-ai';
  el.textContent=text;
  const msgs=document.getElementById('msgs');
  msgs.appendChild(el);
  msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  const el=document.createElement('div');
  el.className='typing-wrap'; el.id='typing';
  el.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  const msgs=document.getElementById('msgs');
  msgs.appendChild(el); msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){const e=document.getElementById('typing');if(e)e.remove();}

function fakeChat(userText){
  addMsg('user',userText);
  showTyping();
  const delay=900+Math.random()*600;
  setTimeout(()=>{
    removeTyping();
    const replies=C[active].replies;
    addMsg('ai',replies[replyIdx%replies.length]);
    replyIdx++;
  },delay);
}

function sendChat(){
  const inp=document.getElementById('cinp');
  const t=inp.value.trim(); if(!t)return;
  inp.value='';
  fakeChat(t);
}
document.getElementById('cinp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

// init
buildFeed();
buildQueue();
renderCenter();
setInterval(addFeed,3500);
setTimeout(()=>{
  addMsg('ai',`Агент активен. Загружено ${C.length} заявок. Рекомендую начать с заявки #${C[active].id} — ${C[active].name}. Вероятность одобрения ${C[active].pct}%.`);
},600);
</script>
</body>
</html>
